attachments:
  # from source: Wing root saddle screwed to the pod (4 x M3x12, F08). Rating is NOT a screw rating: it is the joiner capacity at yield expressed as total wing lift: analysis/results.json C0.struct.MS_J 1.4126 x (2 x feaWingForce 189.64 N, params.txt) = 535.8 N
  - {id: wing-pod, parent: pod, child: wing, method: bolted, location: [700, 0, 6], embed_ok: true, rated_load_n: 535.8}
  # from source: Modelling artefact: the CAD pod has a slot for the wing saddle and joiner, the cylinder pod does not, so the spar is attached to the pod as well. Same load path and rating as wing-pod (joiner yield capacity, struct.MS_J 1.4126)
  - {id: spar-pod, parent: pod, child: spar, method: press-fit, location: [696.7, 0, 6.044], embed_ok: true, rated_load_n: 535.8}
  # from source: Spar sockets bonded in the Ø26.0 hot-wired channel (FT05). Rating = joiner yield capacity as total wing lift (struct.MS_J 1.4126 x 2 x 189.64 N)
  - {id: spar-wing, parent: wing, child: spar, method: glued, location: [696.7, 500, 6.044], embed_ok: true, rated_load_n: 535.8}
  # placeholder — not from source: 2 x F06 M3x35 into the spar-collar inserts; 50 N per M3 into printed insert (placeholder)
