# A1: C0 (v0.4.0) with the pusher replaced by two wingtip tractor propellers. Derived from designs/c0-lift-cruise.
# Baseline: variant numbers are from the v0.3.1 baseline (6.182 kg, 20 m/s) per DECISIONS.md; every part the variant did not change keeps C0 v0.4.0. See README.md.
# Frame: same transform as C0 (body x aft from the pod nose, x = 600 - 1000 X_cad, y = 1000 Z_cad, z = 1000 Y_cad), see designs/c0-lift-cruise/README.md.
schema_version: "0.1"
id: c0-a1
name: A1 wingtip cruise propellers (derived from C0 v0.4.0)
authors: ["UC Berkeley DBF capstone team (source repo dbf-combined)", "converted for aircraft-platform by a tactician agent"]
status: concept
description: >
  C0 with the pod pusher removed and two tractor cruise propellers on wingtip nacelles (right prop clockwise, left counter-clockwise seen
  from behind, inboard blade up, against the tip vortex), a 25.4 mm tube extension through each wing tip, and the battery moved aft to
  hold the CG. Variant numbers come from the team's A1 variant (v0.3.1 baseline) applied as deltas on C0 v0.4.0. Nothing built or flown;
  the source itself says do not build A1 first.
lineage:
  derived_from: [c0-lift-cruise]
  inspired_by:
    - "dbf-combined@1244ebc concepts/concepts.json (id a1)"
    - "dbf-combined@1244ebc concepts/variants/a1/design.md"
    - "dbf-combined@1244ebc concepts/variants/a1/geometry.json"
    - "dbf-combined@1244ebc concepts/variants/a1/metrics.json"
    - "dbf-combined@1244ebc concepts/variants/a1/calc.py, calc_out.json"
    - "dbf-combined@1244ebc fusion/variants/build_a1_fusion.py"
    - "dbf-combined@1244ebc DECISIONS.md (baseline table, self-inconsistency 5)"
morphology:
  lift: fixed-wing
  vtol_method: lift-plus-cruise
  tail: other   # H-tail on twin booms with two fins; the enum has no twin-boom H-tail
  propulsion_count: 6   # 4 lift + 2 wingtip cruise (concepts/variants/a1/metrics.json motors.value 6). C0 v0.4.0 has no spare motor (DECISIONS.md D9), so one extra X4110S must be bought; in v0.3.1 the spare became the second tip motor
requirements:
  mtow_g: 8207   # C0 sizing 7438 + 769 g bottom-up delta of this model (8185 - 7416) + the same 22 g margin C0 has. Source delta is +728 g (concepts/variants/a1/metrics.json mass_kg.value 6.9104 - C0 6.1822, v0.3.1); the 41 g difference is C0 v0.4.0 pusher-side parts differing from v0.3.1 (README)
  payload_g: 0          # docs/DESIGN-BASIS.md R12 (no payload, no ballast) via cad/README.md
  cruise_speed_mps: 18  # analysis/results.json base.Vc
  stall_speed_max_mps: 12   # R11, aero_results.json stall.V_stall_req_mps
  endurance_min: 10     # R10, aero_results.json mission.R10_req_min (10 min of cruise)
  budget_usd: 2000      # CLAUDE.md of the source: fixed $2,000 budget
flight:
  cl_max: 1.115         # analysis/results.json base.CLmax = aero_results.json CL_max_3D.adopted
  air_density_kgm3: 1.225   # analysis/results.json base.rho
root: pod
materials:
  xps-foam:
    density_g_cm3: 0.032
    notes: "XPS FOAMULAR (analysis/sizing.mjs rhoFoam 32 kg/m3, SRC-15); skinned with Scotch packing tape"
  petg:
    density_g_cm3: 1.27
    notes: "ELEGOO PETG; 1.27 g/cm3 is an EST typical value (cad/verification.txt)"
  pa6-cf20:
    notes: "Polymaker Fiberon PA6-CF20 for motor mounts and pusher cup (HDT 173 C); density not extracted from the source"
  al-6061-t6:
    density_g_cm3: 2.7
    notes: "6061-T6 (SOLIDWORKS library, yield 275 MPa, E 69 GPa; cad/params.txt matSig matE matRho)"

components:
  # Foam pod, canopy, battery tray, FC tray and printed frames (CAD pod profile is an ellipse nose / parallel / smoothstep taper to R30; modelled here as a plain R80 x 1000 cylinder)
  # src: mass_budget.json rows Fuselage_Pod 387.3 + Canopy 31.6 + Battery_Tray 35.0 + FC_Tray 11.6 + Pod frames 74.0 = 539.5 (group "Fuselage pod" 567.2 less pitot 27.7); geometry params.txt fusL 1.000 fusR 0.080 comp=Fuselage_Pod (nose at CAD X +0.600, axis Y -0.030)
  # cg_offset x = 435.9 - 500: group centroid 0.4359 m from the nose (mass_budget.json calibration.stations.pod_from_nose)
  - id: pod
    type: fuselage
    geometry: {cylinder: {radius: 80, length: 1000, axis: x}}
    position: [500, 0, -30]
    mass_g: 551.5   # 539.5 (C0) + 12 g Battery_Tray_Ext rails (concepts/variants/a1/geometry.json add Battery_Tray_Ext 12.0 g; design.md "Mass (est)"); the solid aft cap (HW-035) and the 170 x 60 mm belly hatch are not modelled. cg_offset unchanged — variant source silent, 12 g at x ~720 would move the group CG by under 3 mm
    cg_offset: [-64.1, 0, 0]
    material: xps-foam
    manufacturing: {method: hotwire-foam}

  # Main wing, one mirrored surface: two 1.12 m XPS panels + saddle, ailerons (26 % chord, outer 55 % span, not modelled separately), tape skin, printed hardpoints. Slab hull, not the NACA 2415 section.
  # src: mass_budget.json group "Wing" 1809.4 g minus Spar_Tube 478.3 and Wing_Joiner 197.1 = 1133.97; planform params.txt chord 0.322333, panelLen 1.12 + saddle 0.08 per side = span 2.4 m, tc 0.15, foilWing NACA 2415; LE at CAD X 0 -> x 600; slab centred on the spar axis (sparY 0.006044)
  # cg_offset x = -20.9: wing-group centroid 0.124 m aft of the LE (analysis/results.json C0.cg.items Wing) with the spar (675.4 g at x 696.7) removed, minus the slab centroid x 761.2 (calc)
  - id: wing
    type: wing
    geometry: {lifting_surface: {span: 2400, root_chord: 322.333, tip_chord: 322.333, sweep_le_deg: 0, dihedral_deg: 0, thickness_ratio: 0.15, airfoil: "NACA 2415", mirrored: true, lifting: true}}
    position: [600, 0, 6.044]
    mass_g: 1133.97
    cg_offset: [-20.906, 0, 0]
    material: xps-foam
    manufacturing: {method: hotwire-foam}

  # Two 0.8 m spar sockets (OD 25.4) and the 0.76 m slip-fit joiner (OD 22.2) lumped as one 25.4 mm tube across the full 1.76 m (the 160 mm centre gap is the joiner only)
  # src: mass_budget.json Spar_Tube 478.3 + Wing_Joiner 197.1 = 675.4 (equals analysis/results.json base.m_spar 0.67524); params.txt sparX -0.0967 (30 % chord), sparOD 0.0254, sparLen 0.8, joinLen 0.76
  - id: spar
    type: structure
    geometry: {cylinder: {radius: 12.7, length: 1760, axis: y}}
    position: [696.7, 0, 6.044]
    mass_g: 675.4
    material: al-6061-t6
    manufacturing: {method: hand-cut, part_number: "OnlineMetals 6061-T6 tube 1.000 x 0.058 in x 96 in (sockets) + 0.875 x 0.058 in x 36 in (joiner)"}

  # Port boom: 1046.0 mm front tube + 485.9 mm rear stub joined by a printed splice plug (plug mass included)
  # src: mass_budget.json (Boom_Front 385.7 + Boom_Rear_Stub 179.5)/2 = 282.6 plus Splice_Plug 50.0/2 = 25.0; extent params.txt xFront 0.407727 .. xStub0 -1.074133 (analysis/results.json C0.geo.booms x1 0.4577, x0 -1.0741), yIn 0.4337, boom axis CAD Y -0.032938
  - id: boom_l
    type: boom
    geometry: {cylinder: {radius: 12.7, length: 1531.86, axis: x}}
    position: [908.203, -433.7, -32.938]
    mass_g: 307.6
    material: al-6061-t6
    manufacturing: {method: hand-cut, part_number: "OnlineMetals 6061-T6 tube 1.000 x 0.035 in x 72 in"}

  # Front boom clamp (PETG, upper + lower half) bonded to the spar collar; top meets the wing lower surface at 30 % chord
  # src: mass_budget.json Boom_Clamp_F_Upper 22.67 + Lower 27.33 = 50.0 for two sets, /2; mesh bounds Boom_Clamp_F_Upper/Lower; comp= position params.txt (X -0.0967, Y -0.032938, Z +-0.4337)
  - id: boom_clamp_f_l
    type: structure
    geometry: {box: {size: [34, 46, 31.5]}}
    position: [696.7, -433.7, -33.888]
    mass_g: 25
    material: petg
    manufacturing: {method: 3d-print-fdm, machine: jacobs-fdm}

  # Rear boom clamp (PETG) bolted to the rear hardpoint plate at 80 % chord (top is inside the wing slab because the slab is thicker than the real section there)
  # src: mass_budget.json Boom_Clamp_R_Upper 51.27 + Lower 26.73 = 78.0 for two sets, /2; mesh bounds Boom_Clamp_R_Upper/Lower; comp= X -0.257867
