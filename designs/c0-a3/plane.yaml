# A3: C0 (v0.4.0) with a printed nacelle and hub cap on each lift rotor to cut stopped-rotor drag. Derived from designs/c0-lift-cruise.
# Baseline: variant numbers are from the v0.3.1 baseline (6.182 kg, 20 m/s) per DECISIONS.md; every part the variant did not change keeps C0 v0.4.0. See README.md.
# Frame: same transform as C0 (body x aft from the pod nose, x = 600 - 1000 X_cad), see designs/c0-lift-cruise/README.md.
schema_version: "0.3"
id: c0-a3
name: A3 aligned, faired stopped lift rotors (derived from C0 v0.4.0)
authors: ["UC Berkeley DBF capstone team (source repo dbf-combined)", "converted for aircraft-platform by a tactician agent"]
status: concept
description: >
  C0 airframe with a printed NACA 0022 nacelle around each lift motor mount and a rotating hub cap on each lift prop; a magnetic detent
  (and, in phase 2, a reed switch plus Lua nudge) parks each two-blade prop fore-aft in cruise so the stopped rotors cost less drag.
  Variant numbers come from the team's A3 variant (v0.3.1 baseline) applied as deltas on C0 v0.4.0. Phase 2 (reed wiring) mass is
  included, as in the source headline numbers. Nothing built or flown.
lineage:
  derived_from: [c0-lift-cruise]
  inspired_by:
    - "dbf-combined@1244ebc concepts/concepts.json (id a3)"
    - "dbf-combined@1244ebc concepts/variants/a3/design.md"
    - "dbf-combined@1244ebc concepts/variants/a3/geometry.json"
    - "dbf-combined@1244ebc concepts/variants/a3/metrics.json"
    - "dbf-combined@1244ebc concepts/variants/a3/analysis/final_runs.json (cited by metrics.json)"
    - "dbf-combined@1244ebc fusion/variants/build_a3_fusion.py"
    - "dbf-combined@1244ebc DECISIONS.md (baseline table, self-inconsistency 5)"
morphology:
  lift: fixed-wing
  vtol_method: lift-plus-cruise
  tail: other   # H-tail on twin booms with two fins; the enum has no twin-boom H-tail
  propulsion_count: 5
requirements:
  mtow_g: 7688   # C0 sizing 7438 + 250 g variant delta (concepts/variants/a3/metrics.json mass_kg 6.432 - C0 6.182, incl. phase-2 wiring); source MTOW 6.432 kg is v0.3.1 and is not used
  payload_g: 0          # docs/DESIGN-BASIS.md R12 (no payload, no ballast) via cad/README.md
  cruise_speed_mps: 18  # analysis/results.json base.Vc
  stall_speed_max_mps: 12   # R11, aero_results.json stall.V_stall_req_mps
  endurance_min: 10     # R10, aero_results.json mission.R10_req_min (10 min of cruise)
  budget_usd: 2000      # CLAUDE.md of the source: fixed $2,000 budget
flight:
  cl_max: 1.115         # analysis/results.json base.CLmax = aero_results.json CL_max_3D.adopted
  air_density_kgm3: 1.225   # analysis/results.json base.rho
root: pod
materials:
  xps-foam:
    density_g_cm3: 0.032
    notes: "XPS FOAMULAR (analysis/sizing.mjs rhoFoam 32 kg/m3, SRC-15); skinned with Scotch packing tape"
  petg:
    density_g_cm3: 1.27
    notes: "ELEGOO PETG; 1.27 g/cm3 is an EST typical value (cad/verification.txt)"
  pa6-cf20:
    notes: "Polymaker Fiberon PA6-CF20 for motor mounts and pusher cup (HDT 173 C); density not extracted from the source"
  al-6061-t6:
    density_g_cm3: 2.7
    notes: "6061-T6 (SOLIDWORKS library, yield 275 MPa, E 69 GPa; cad/params.txt matSig matE matRho)"

components:
  # Foam pod, canopy, battery tray, FC tray and printed frames (CAD pod profile is an ellipse nose / parallel / smoothstep taper to R30; modelled here as a plain R80 x 1000 cylinder)
  # src: mass_budget.json rows Fuselage_Pod 387.3 + Canopy 31.6 + Battery_Tray 35.0 + FC_Tray 11.6 + Pod frames 74.0 = 539.5 (group "Fuselage pod" 567.2 less pitot 27.7); geometry params.txt fusL 1.000 fusR 0.080 comp=Fuselage_Pod (nose at CAD X +0.600, axis Y -0.030)
  # cg_offset x = 435.9 - 500: group centroid 0.4359 m from the nose (mass_budget.json calibration.stations.pod_from_nose)
  - id: pod
    type: fuselage
    geometry: {cylinder: {radius: 80, length: 1000, axis: x}}
    position: [500, 0, -30]
    mass_g: 539.5
    cg_offset: [-64.1, 0, 0]
    material: xps-foam
    manufacturing: {method: hotwire-foam}

  # Main wing, one mirrored surface: two 1.12 m XPS panels + saddle, ailerons (26 % chord, outer 55 % span, not modelled separately), tape skin, printed hardpoints. Slab hull, not the NACA 2415 section.
  # src: mass_budget.json group "Wing" 1809.4 g minus Spar_Tube 478.3 and Wing_Joiner 197.1 = 1133.97; planform params.txt chord 0.322333, panelLen 1.12 + saddle 0.08 per side = span 2.4 m, tc 0.15, foilWing NACA 2415; LE at CAD X 0 -> x 600; slab centred on the spar axis (sparY 0.006044)
  # cg_offset x = -20.9: wing-group centroid 0.124 m aft of the LE (analysis/results.json C0.cg.items Wing) with the spar (675.4 g at x 696.7) removed, minus the slab centroid x 761.2 (calc)
  - id: wing
    type: wing
    geometry: {lifting_surface: {span: 2400, root_chord: 322.333, tip_chord: 322.333, sweep_le_deg: 0, dihedral_deg: 0, thickness_ratio: 0.15, airfoil: "NACA 2415", mirrored: true, lifting: true}}
    position: [600, 0, 6.044]
    mass_g: 1133.97
    cg_offset: [-20.906, 0, 0]
    material: xps-foam
    manufacturing: {method: hotwire-foam}

  # Two 0.8 m spar sockets (OD 25.4) and the 0.76 m slip-fit joiner (OD 22.2) lumped as one 25.4 mm tube across the full 1.76 m (the 160 mm centre gap is the joiner only)
