    mass_g: 304.089536
    material: pa6-cf20
    manufacturing: {method: 3d-print-fdm, machine: jacobs-fdm-fortus, part_number: "PA6-CF20 nacelle (design report BOM 'Mounts') around a SunnySky X3515S KV400 motor", cost_usd: 44.99}
    propulsion: {max_thrust_n: 32.407694, axis: [-1, 0, 0], role: both}

