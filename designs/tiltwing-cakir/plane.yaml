# TiltWing tilt-wing VTOL (Cakir & Kurtulus 2022 sizing, UC Berkeley davinciucberkeley-collab/TiltWing @ 1488f8f),
# converted to schema 0.2 by a tactician agent. Read designs/tiltwing-cakir/README.md for the frame, provenance
# table and placeholders. Every number cites its source (file + key/formula) in a comment; anything the source
# does not give is marked "placeholder - not from source". Values are the model's DEFAULT slider values
# (= the paper's), evaluated with model.js size() (node) and cad/params.json (which equals the defaults).
# Frame: cad/tools/cad_export.py states "X aft from the nose, Y to starboard, Z up. Units mm" = the platform body
# frame, so no transform is needed. Tilt sign/axis verified against cad/hover_tilt90/*.stl (README.md).
schema_version: "0.2"
id: tiltwing-cakir
name: TiltWing tilt-wing VTOL (Cakir & Kurtulus 2022 study)
authors: ["davinciucberkeley-collab/TiltWing (source repo, model after Cakir & Kurtulus 2022)", "converted for aircraft-platform by a tactician agent"]
status: concept
description: >
  Parametric tilt-wing VTOL study: 2.0 m S1223 tilting wing with 4 tractor rotors, tilting NACA 0009 horizontal tail
  with 2 rotors, no vertical tail (model.js header). Mass 9.153 kg by the sizing (M1). Nothing has been built
  (source README: study, estimates to replace with measurements).
lineage:
  derived_from: []
  inspired_by: ["TiltWing@1488f8f (model.js, cad/params.json, cad/manifest.json, tools/cad_export.py, data/verify.json)", "Cakir & Kurtulus, Turk J Elec Eng & Comp Sci 30 (2022) 767-784, doi:10.3906/elk-2105-59"]
morphology:
  lift: fixed-wing
  vtol_method: tiltwing
  tail: other   # tilting all-moving horizontal tail with no vertical fin; the enum has no such cell
  propulsion_count: 6
requirements:
  mtow_g: 9152.69       # model.js M1 m = (m_struct+m_elec+m_payload)/(1-f_prop) = 9.152686066 kg, rounded up to 9152.69 g so the exact roll-up passes (data/verify.json "M1 takeoff mass")
  payload_g: 2500       # model.js PAPER.payload 2.5 kg (paper s2)
  cruise_speed_mps: 20  # model.js PAPER.Vc 20 m/s (paper: 15-25 m/s, CFD at 20)
  endurance_min: 60     # model.js PAPER.out.flightMin 60 (paper goal; the validator has no energy check)
  budget_usd: 2000      # design report (artifact b23ddeab..., Fabrication section): "fits the $2,000 project budget"
flight:
  cl_max: 2.0142386     # model.js P4 CLmax,3D = k_3D(0.9, estimate) * c_lmax(S1223, Re 3.98e5) 2.238, size() r.CLmax
  air_density_kgm3: 1.2250123   # model.js E1 ISA sea level (p.rho from isa(alt 0, dT 0))
  hover_pose: hover     # wing and tail at 90 deg: cad/manifest.json configs.hover_tilt90.tilt_deg
  cruise_pose: cruise   # cad/manifest.json configs.cruise_tilt0.tilt_deg 0
root: fuselage
materials:
  xps-foam:
    notes: "FOAMULAR NGX F-250 cores, hot-wired, skinned (design report BOM 'Wing / tail cores', build sequence 'Wing halves'); density not stated in the source"
  carbon-tube:
    density_g_cm3: 1.55
    notes: "model.js MATERIALS cf_tube rho 1550 kg/m3 (estimate: typical roll-wrapped CF tube); Rock West 45002 per design report BOM"
  pa6-cf20:
    notes: "Polymaker PA6-CF20 nacelle mounts (design report BOM 'Mounts'); density not stated in the source"
  glass-epoxy:
    notes: "1 mm glass/epoxy shell over a foam plug (design report BOM 'Fuselage'); density not stated in the source"
components:
  # Fuselage, modelled as a plain R100 x 1800 cylinder. The CAD body is a revolved profile (ellipse nose over 0.32 L, parallel to 0.58 L, then a taper to 0.28 R); the schema has no profile geometry.
  # src: model.js M1 mFus = 0.55 kg/m * Lf * (df/0.2) = 0.990 kg (0.55 kg/m: calibrated so the paper geometry gives the 2.0 kg airframe, model.js comment); Lf 1.8 m, df 0.2 m (PAPER.Lf, PAPER.df); cad_export.py fuselage(Lf, df/2)
  # CG at mid-length: the source mass model is per metre of length (kg/m), so uniform along x
  - id: fuselage
    type: fuselage
    geometry: {cylinder: {radius: 100, length: 1800, axis: x}}
    position: [900, 0, 0]
    mass_g: 990
    material: glass-epoxy
    manufacturing: {method: composite-layup}   # design report BOM: glass/epoxy shell over a foam plug. manufacturing.yaml has no layup machine and no machine_optional_methods entry -> T4 FAIL by design

  # Wing tilt shaft (the "spar" of cad_export.py): the pivot of the wing tilt joint, fixed to the fuselage in the bearing bay
  # src: cad_export.py spar = circle(0.012 m radius) extruded 1.2*df = 240 mm along y at (xw, 0, zw); xw 756.0 = 0.42*Lf (model.js size() xw), zw = 0.42*df = 84 (cad_export.py build()); STL Wing_Tilt_Spar.stl bounds x 744-768, y +-120, z 72-96
  # mass: placeholder - not from source. 1 g, carved out of the wing bucket (model.js "wing 1.40 kg/m2 incl. tilt mechanism") so the total stays the source mass. The design report BOM names a 25 mm / 26.8 mm Rock West 45002 carbon tube per half; the CAD shaft is 24 mm. CAD used here.
  - id: wing_spar
    type: structure
    geometry: {cylinder: {radius: 12, length: 240, axis: y}}
    position: [756, 0, 84]
    mass_g: 1.0
    material: carbon-tube
    manufacturing: {method: purchased, part_number: "Rock West Composites 45002 carbon tube 26.8/25.0 mm x 72 in (design report BOM; CAD shaft is 24 mm OD)", cost_usd: 99.99}

  # Tail tilt shaft
  # src: cad_export.py tspar = circle(0.008 m radius) extruded 0.6*df = 120 mm along y at (xt, 0, zt); xt 1656.0 = 0.92*Lf (model.js size() xt), zt = 0.12*df = 24; STL Tail_Tilt_Spar.stl bounds x 1648-1664, y +-60, z 16-32
  # mass: placeholder - not from source. 1 g carved out of the tail bucket. Design report BOM: "10 mm carbon tube, 1 mm wall" (unpriced); the CAD shaft is 16 mm.
  - id: tail_spar
    type: structure
    geometry: {cylinder: {radius: 8, length: 120, axis: y}}
    position: [1656, 0, 24]
    mass_g: 1.0
    material: carbon-tube
    manufacturing: {method: purchased, part_number: "10 mm carbon tube, 1 mm wall (design report BOM, unpriced)"}

  # Main wing, ONE mirrored slab spanning y = -1000..+1000. The CAD wing is two lofted halves that start at y = +-110 (y_in = 0.55*df) so they clear the fuselage and can tilt; the schema has no root offset, so the slab also fills the root strip (see validator-comparison.md, clipping).
  # src: model.js G1-G4 S = b^2/AR = 0.575540 m2 (span 2.0 m, AR 6.95), cr 338.553 mm, ct 236.987 mm (taper 0.7), LE sweep 5.7994 deg (straight TE, G4); root LE x = xw - 0.3*cr = 654.434 mm (model.js size() xLEroot; spar at 30 % chord, paper Fig. 3)
  # thickness_ratio 0.1511 = bounding height of the S1223 section incl. camber (data/airfoils.json s1223 coords: z -0.0158..+0.1353 of chord; true max thickness 0.1211); slab z centre = zw + 0.0597*cr = 104.228523 mm (mid of that envelope), checked against Wing_S1223.stl bounds z 78.8-128.3
  # mass: model.js M1 mWing = 1.40 kg/m2 * S = 805.755 g (incl. tilt mechanism, estimate calibrated to the paper's 2.0 kg airframe), less the 1 g wing_spar placeholder
  - id: wing
    type: wing
    geometry: {lifting_surface: {span: 2000, root_chord: 338.552687, tip_chord: 236.986881, sweep_le_deg: 5.799405, dihedral_deg: 0, thickness_ratio: 0.1511, airfoil: "S1223", mirrored: true, lifting: true}}
    position: [654.434194, 0, 104.228523]
    mass_g: 804.755396
    material: xps-foam
    manufacturing: {method: hotwire-foam}   # design report build sequence: "Hot-wire S1223 cores from tiltwing/cad coordinates, skin them". manufacturing.yaml has no hot-wire machine -> T4 FAIL by design

  # Horizontal tail (all-moving, tilts with the wing), ONE mirrored slab; the CAD halves start at y = +-50 (0.25*df)
  # src: model.js G5 S_h = V_h S c/l_t = 0.115856 m2 (V_h 0.61, PAPER.Vh); ARh 4.1 (model.js size() comment, from paper Fig. 2) -> span 689.210128 mm, root chord 186.777812 mm, tip chord 149.42225 mm (taper 0.8, PAPER.tailTaper); LE sweep 5 deg (cad_export.py surface(..., 5.0, ...)); root LE x = xt - 0.3*crh = 1599.966656 mm (cad_export.py xth); NACA 0009 thickness 0.09 (data/airfoils.json naca0009), z centre zt = 24 (STL H_Tail_NACA0009.stl z 15.8-32.2)
  # mass: model.js M1 mTail = 1.0 kg/m2 * S_h = 115.856 g, less the 1 g tail_spar placeholder
  - id: tail
    type: tail_surface
    geometry: {lifting_surface: {span: 689.210128, root_chord: 186.777812, tip_chord: 149.42225, sweep_le_deg: 5, dihedral_deg: 0, thickness_ratio: 0.09, airfoil: "NACA 0009", mirrored: true, lifting: true}}
    position: [1599.966656, 0, 24]
    mass_g: 114.856244
    material: xps-foam
    manufacturing: {method: hotwire-foam}   # design report BOM: wing / tail cores in FOAMULAR, build sequence "Build NACA 0009 tail halves". No hot-wire machine in manufacturing.yaml -> T4 FAIL by design

  # Wing rotor 1: nacelle + motor as one cylinder (R28), from the prop-disc rear face to the nacelle aft end. The CAD spinner cone (61.6 mm forward of the nacelle) is not modelled.
  # src: cad_export.py rotor(): nacelle length 0.55*cr+0.1 m = 286.203978 mm, radius 28 mm, starts 0.45*length ahead of the local LE; local LE x = xLEroot + |y|*tan(sweep) = 756 mm; y = -1000 = +-0.5/0.2 * span; z = zw 84 (STL Wing_Nacelle_1.stl bounds x 565.60821-913.412188, y -1028..-972)
  # mass: model.js M1 mMotors = f_prop*(1-f_batt)*m = 1830.537 g for the propulsion kit (motors, ESCs, props: the source does not split it), / 6 rotors = 305.090 g EQUAL SPLIT (placeholder - not from source; the 4 wing rotors and 2 tail rotors are different sizes), less the 1 g prop placeholder
  # max_thrust_n = model.js TfMax = Tf1*TW = 32.4077 N (hover trim thrust per wing rotor 21.605 N times installed T/W 1.5, estimate)
