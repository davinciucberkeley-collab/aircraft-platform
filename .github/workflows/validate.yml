name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Score every design
        run: |
          status=0
          echo "# Design scorecards" >> "$GITHUB_STEP_SUMMARY"
          for d in designs/*/; do
            plane validate "$d" >> "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit $status
