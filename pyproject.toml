[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircraft-platform"
version = "0.1.0"
description = "Shared schema, validators, CLI and MCP server for our aircraft designs"
requires-python = ">=3.10"
dependencies = ["pyyaml", "jsonschema", "numpy", "scipy", "trimesh", "manifold3d", "rtree", "click"]

[project.optional-dependencies]
sim = ["mujoco>=3"]
mcp = ["mcp>=1.2"]
dev = ["pytest"]

[project.scripts]
plane = "aircraft_platform.cli:main"
plane-mcp = "aircraft_platform.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "core"}
packages = ["aircraft_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
