# Example design so every tool has something real to run on.
# Twin-motor flying-wing tailsitter: hovers nose-up on its wingtip fins, transitions to wing-borne flight.
schema_version: "0.1"
id: example-tailsitter-wing
name: Example twin-motor tailsitter flying wing
authors: [platform bootstrap]
status: concept
description: >
  Swept flying wing with two tractor motors on leading-edge pods and wingtip fins that double as
  landing legs. Foamboard and laser-cut ply, sized for the Jacobs shop.
lineage:
  derived_from: []
  inspired_by: []
morphology:
  lift: flying-wing
  vtol_method: tailsitter
  tail: none
  propulsion_count: 2
requirements:
  mtow_g: 900
  stall_speed_max_mps: 9
  cruise_speed_mps: 14
  budget_usd: 250
flight:
  cl_max: 1.0
root: center_body

components:
  - id: center_body
    type: fuselage
    geometry: {box: {size: [300, 80, 80]}}
    position: [150, 0, 0]
    mass_g: 120
    manufacturing: {method: laser-cut, machine: jacobs-laser}

  - id: wing
    type: wing
    geometry:
      lifting_surface: {span: 1000, root_chord: 250, tip_chord: 150, sweep_le_deg: 20, thickness_ratio: 0.12, airfoil: MH45}
    position: [60, 0, 0]
    mass_g: 180
    manufacturing: {method: foamboard}

  - id: mount_l
    type: structure
    geometry: {box: {size: [45, 20, 20]}}
    position: [137, -250, 0]
    mass_g: 10
    manufacturing: {method: laser-cut, machine: jacobs-laser}  # stacked ply; FDM fit unverifiable until printer volumes are listed
  - id: mount_r
    type: structure
    geometry: {box: {size: [45, 20, 20]}}
    position: [137, 250, 0]
    mass_g: 10
    manufacturing: {method: laser-cut, machine: jacobs-laser}  # stacked ply; FDM fit unverifiable until printer volumes are listed

  - id: motor_l
    type: motor
    geometry: {cylinder: {radius: 14, length: 30, axis: x}}
    position: [100, -250, 0]
    mass_g: 60
    manufacturing: {method: purchased, part_number: "2212 1000KV"}
    propulsion: {max_thrust_n: 9.0, axis: [-1, 0, 0], role: both}
  - id: motor_r
    type: motor
    geometry: {cylinder: {radius: 14, length: 30, axis: x}}
    position: [100, 250, 0]
    mass_g: 60
    manufacturing: {method: purchased, part_number: "2212 1000KV"}
    propulsion: {max_thrust_n: 9.0, axis: [-1, 0, 0], role: both}

  - id: prop_l
    type: propeller
    description: Swept disc of a 10x4.5 prop
    geometry: {cylinder: {radius: 127, length: 10, axis: x}}
    position: [80, -250, 0]
    mass_g: 12
    manufacturing: {method: purchased, part_number: "APC 10x4.5"}
  - id: prop_r
    type: propeller
    geometry: {cylinder: {radius: 127, length: 10, axis: x}}
    position: [80, 250, 0]
    mass_g: 12
    manufacturing: {method: purchased, part_number: "APC 10x4.5"}

  - id: fin_l
    type: tail_surface
    description: Wingtip fin, also the landing leg in hover
    geometry:
      lifting_surface: {span: 200, root_chord: 150, tip_chord: 100, sweep_le_deg: 30, mirrored: true, lifting: false}
    position: [242, -500, 0]
    rotation_deg: [90, 0, 0]
    mass_g: 15
    manufacturing: {method: laser-cut, machine: jacobs-laser}
  - id: fin_r
    type: tail_surface
    geometry:
      lifting_surface: {span: 200, root_chord: 150, tip_chord: 100, sweep_le_deg: 30, mirrored: true, lifting: false}
    position: [242, 500, 0]
    rotation_deg: [90, 0, 0]
    mass_g: 15
    manufacturing: {method: laser-cut, machine: jacobs-laser}

  - id: battery
    type: battery
    geometry: {box: {size: [100, 35, 24]}}
    position: [140, 0, -27.5]
    mass_g: 250
    manufacturing: {method: purchased, part_number: "3S 2200mAh"}

  - id: flight_controller
    type: flight_controller
    geometry: {box: {size: [36, 36, 10]}}
    position: [200, 0, 28]
    mass_g: 15
    manufacturing: {method: purchased, part_number: "Matek H743"}

attachments:
  # Ratings revised 2026-11-11 after the tier-2 drop test showed peaks of 82 N (wing-body),
  # 51 N (each fin) and 53 N (battery). Joints re-specced with ~1.5x margin; battery now strapped, not taped.
  - {id: wing-body, parent: center_body, child: wing, method: slot-tab, location: [150, 0, 0], embed_ok: true, rated_load_n: 125}
  - {id: mount-l, parent: wing, child: mount_l, method: glued, location: [155, -250, 0], embed_ok: true, rated_load_n: 20}
  - {id: mount-r, parent: wing, child: mount_r, method: glued, location: [155, 250, 0], embed_ok: true, rated_load_n: 20}
  - {id: motor-l, parent: mount_l, child: motor_l, method: bolted, location: [115, -250, 0], rated_load_n: 50}
  - {id: motor-r, parent: mount_r, child: motor_r, method: bolted, location: [115, 250, 0], rated_load_n: 50}
  - {id: prop-l, parent: motor_l, child: prop_l, method: press-fit, location: [85, -250, 0], rated_load_n: 30}
  - {id: prop-r, parent: motor_r, child: prop_r, method: press-fit, location: [85, 250, 0], rated_load_n: 30}
  - {id: fin-l, parent: wing, child: fin_l, method: slot-tab, location: [300, -495, 0], embed_ok: true, rated_load_n: 80}
  - {id: fin-r, parent: wing, child: fin_r, method: slot-tab, location: [300, 495, 0], embed_ok: true, rated_load_n: 80}
  - {id: battery-bay, parent: center_body, child: battery, method: clamp, location: [140, 0, -27.5], embed_ok: true, rated_load_n: 80}
  - {id: fc-mount, parent: center_body, child: flight_controller, method: bolted, location: [200, 0, 28], embed_ok: true, rated_load_n: 5}
