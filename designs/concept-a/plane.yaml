schema_version: "0.4"
id: concept-a
name: Concept A, scaled quad tailsitter flying wing (D-182)
authors: ["UC Berkeley DBF capstone team (source repo dbf-combined)", "imported for aircraft-platform by `plane import dbf`"]
status: designed
description: >
  Four canted motors (T-Motor MN2212 KV780, APC 9x4.5 props) on four carbon arms off a printed hub, a 0.90 m x 0.245 m
  XPS-foam wing (Selig S5010) with two elevons, two fin tubes that double as the four landing feet. Sits on the fin
  tips nose-up for hover. Built from the team's own CAD (redesign/qp/A/cad/model, stub backend). Nothing built or flown.
lineage:
  derived_from: []
  inspired_by: ["dbf-combined@171ec426 redesign/qp/A/cad (a_model.py, amodel/), qp/A/params-A.json"]
morphology:
  lift: flying-wing
  vtol_method: tailsitter
  tail: none            # no tail; two fin tubes (FIN-001/002/004) at y +-380 mm act as fins and landing legs
  propulsion_count: 4   # PRP-001-UR/UL/LR/LL
requirements:
  mtow_g: 1470              # params-A.json req.mass_gate_kg 1.47 kg (A-P1 weigh-in gate)
  cruise_speed_mps: 17        # params-A.json mission.cruise_ms
  stall_speed_max_mps: 13.08    # params-A.json mission.cruise_ms 17 / req.cruise_ratio 1.3 (A-P6: 1.3 Vs < cruise)
  budget_usd: 2           # params-A.json req.budget_usd
flight:
  cl_max: 0.75            # params-A.json mission.clmax 0.75, EST in the source (measured stall will replace it)
  air_density_kgm3: 1.2   # params-A.json env.rho_kgm3 (MISSION.md s1)
  # no hover_pose: a tailsitter hovers nose-up with no tilting joint, and the validator then takes -x as up
